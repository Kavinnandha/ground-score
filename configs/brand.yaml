# Brand selection and corpus construction.
#
# The brand was chosen from measured evidence (results/brand_profile.md), not
# from intuition. The pre-registered guess before profiling was SpotifyCares;
# the data rejected it (37.7% handoff rate -- 3.5x AmazonHelp's -- meaning more
# than a third of its public replies are "please DM us", which makes "draft a
# grounded reply" a task with nothing to ground in).
#
# NOTE: the first version of the profiler measured only DM-style deflection and
# reported AmazonHelp at 0.008. That undercounted by 13x -- AmazonHelp rarely
# says "DM us" and instead routes people to a contact page. The corrected
# handoff_rate below is the union of both forms. The ranking survived the fix.
#
# AmazonHelp wins on the three statistics that matter for this assignment:
#   handoff_rate       0.108  (2nd lowest: replies mostly contain real content)
#   lexical_diversity  0.183  (HIGHEST by a wide margin: genuine intent variety,
#                              so the taxonomy is a real problem, not 4 classes)
#   multi_turn_rate    0.597  (HIGHEST: customers actually reply, so whether the
#                              brand's answer resolved anything is observable)
#
# hulu_support has a lower handoff rate (0.057) and higher substantive rate
# (0.927) but its lexical diversity is 0.124 and its multi-turn rate 0.383 -- a
# narrow intent space that would collapse to ~4 classes and make the
# classification result uninformatively easy. Recorded in DECISIONS.md.

brand: AmazonHelp

corpus:
  # Threads pulled before filtering. Roughly 25% are dropped by the usability
  # filter (too short, non-Latin, no brand reply), landing near the 8k target.
  max_threads: 11000
  seed: 42

split:
  # Stable-hash buckets in [0, 100). The golden pool is held out of the
  # retrieval index entirely -- without this the agent can retrieve the very
  # thread it is being evaluated on and score its own answer key.
  golden_pool_buckets: 6        # ~6% -> 498 threads, which 150 are sampled from
  # Everything else becomes the retrieval corpus.

golden:
  target_size: 150   # brief allows 150-250; see DECISIONS.md on the API budget
  # Sampling strata, documented in data/golden/LABELING_NOTES.md
  proportional_share: 0.60      # mirrors real traffic mix
  rare_intent_share: 0.25       # inverse-frequency oversample of tail classes
  adversarial_share: 0.15       # hand-picked hard cases, scored separately
  dev_share: 0.40               # thresholds + prompts tuned here only
  seed: 42

retrieval:
  top_k: 5
  embedding_dim: 768

  # Embedding backend for the retrieval index and for intent clustering.
  #
  # 'ollama' nomic-embed-text, run locally, vectors committed to
  #          cache/emb_cache.npz. This is what ships.
  # 'tfidf'  char-ngram TF-IDF + TruncatedSVD, scikit-learn only. Keyless and
  #          Ollama-less fallback, and what tools/ui.py --backend tfidf uses.
  # 'gemini' gemini-embedding-001. Implemented, not used: the free-tier quota
  #          stalled three separate corpus runs after 40, 600 and 650 of the
  #          10,026 messages, returning 429s with retry hints it then ignored.
  #
  # TF-IDF carried the pipeline while the hosted embedder was failing, and its
  # weakness is real: char n-grams match surface form, so "can't log in" and
  # "password reset loop" sit further apart than they should. nomic-embed-text
  # turned out to run locally at ~324 texts/minute with no quota, which is
  # strictly better, so it took over. The two backends agree on the top-1
  # precedent only 7.5% of the time -- see docs/ground-score-report.pdf, that instability is a
  # headline caveat, not a footnote.
  #
  # The cache is keyed on (model, dim, text), not on provider, so the committed
  # vectors survive a backend switch. A miss is fatal rather than re-embedded
  # into a second vector space.
  backend: ollama
